<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPIRO X CHEAT</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #000000;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
        }
        .card {
            background: #0a0a0a;
            border: 2px solid #ff0000;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.4);
        }
        h1.title {
            color: #ff0000;
            text-align: center;
            font-size: 24px;
            margin-bottom: 25px;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.6);
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #ff4d4d;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 12px;
            background: #121212;
            border: 1px solid #ff0000;
            color: #fff;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
        }
        input:focus {
            box-shadow: 0 0 8px rgba(255, 0, 0, 0.8);
        }
        button.btn {
            width: 100%;
            padding: 12px;
            background: #ff0000;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
        }
        button.btn:hover {
            background: #cc0000;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.8);
        }
        .error-msg {
            color: #ff3333;
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }
        /* Dashboard Styles */
        .dashboard {
            display: none;
            width: 100%;
            max-width: 800px;
            padding: 20px;
        }
        .header-dash {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 1px solid #ff0000;
            padding-bottom: 15px;
        }
        .skins-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }
        .skin-card {
            background: #0d0d0d;
            border: 1px solid #330000;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 0 10px rgba(255,0,0,0.1);
        }
        .skin-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid #ff0000;
            margin-bottom: 12px;
        }
        .skin-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }
        /* Toggle Switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 26px;
        }
        .switch input { 
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #333;
            transition: .4s;
            border-radius: 34px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: #ff0000;
        }
        input:checked + .slider:before {
            transform: translateX(24px);
        }
        /* Terminal / Log box */
        .terminal {
            background: #000;
            border: 1px solid #ff0000;
            color: #00ff00;
            padding: 15px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 13px;
            height: 150px;
            overflow-y: auto;
            margin-top: 20px;
            display: none;
        }
        .admin-panel {
            background: #121212;
            border: 1px dashed #ff0000;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        .admin-panel h3 {
            color: #ff0000;
            margin-bottom: 10px;
        }
        .key-list {
            margin-top: 10px;
            font-size: 14px;
            color: #ccc;
        }
    </style>
</head>
<body>

    <!-- Login Section -->
    <div class="container" id="loginContainer">
        <div class="card">
            <h1 class="title">WELCOME TO SPIRO X CHEAT</h1>
            <div class="form-group">
                <label>اسم المستخدم أو المفتاح (Username / Key):</label>
                <input type="text" id="username" placeholder="أدخل اليوزر أو المفتاح...">
            </div>
            <div class="form-group">
                <label>كلمة المرور (Password):</label>
                <input type="password" id="password" placeholder="أدخل كلمة المرور...">
            </div>
            <button class="btn" onclick="handleLogin()">تسجيل الدخول</button>
            <div class="error-msg" id="errorMsg"></div>
        </div>
    </div>

    <!-- Dashboard Section -->
    <div class="dashboard" id="dashContainer">
        <div class="header-dash">
            <h2 style="color: #ff0000;">SPIRO X CHEAT - PANEL</h2>
            <div>
                <button class="btn" style="padding: 6px 12px; font-size: 13px;" id="adminToggleBtn" onclick="toggleAdminPanel()">لوحة الأدمن</button>
                <button class="btn" style="padding: 6px 12px; font-size: 13px; background: #333; margin-right: 5px;" onclick="location.reload()">خروج</button>
            </div>
        </div>

        <!-- Admin Panel (Visible for Admin) -->
        <div class="admin-panel" id="adminPanel">
            <h3>لوحة تحكم المطور (Admin Creator)</h3>
            <p style="font-size: 13px; margin-bottom: 10px; color: #aaa;">إنشاء مفاتيح تفعيل جديدة يستقبلها النظام فوراً:</p>
            <button class="btn" style="width: auto; padding: 8px 15px; font-size: 14px;" onclick="generateKey()">إنشاء مفتاح جديد (Create Key)</button>
            <div class="key-list" id="keyList">المفاتيح النشطة: <b>SPIRO-ADMIN-2026</b></div>
        </div>

        <h3 style="margin-bottom: 15px; color: #fff;">قائمة السكنات والأدوات:</h3>
        
        <div class="skins-grid">
            <!-- Skin 1 -->
            <div class="skin-card">
                <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200' fill='%23222'><rect width='100%' height='100%'/><text x='50%' y='50%' fill='%23ff0000' font-size='18' text-anchor='middle' dy='.3em'>CRIME ALOK SKIN</text></svg>" alt="Skin 1" id="img1">
                <div class="skin-info">
                    <span style="font-weight: bold; color: #ff4d4d;">سكن الهيب هوب / الجوكر</span>
                    <label class="switch">
                        <input type="checkbox" onchange="toggleInjection(this, 'Skin_HipHop.zip')">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>

            <!-- Skin 2 -->
            <div class="skin-card">
                <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200' fill='%23222'><rect width='100%' height='100%'/><text x='50%' y='50%' fill='%23ff0000' font-size='18' text-anchor='middle' dy='.3em'>Y9 TOOL BUNDLE</text></svg>" alt="Skin 2" id="img2">
                <div class="skin-info">
                    <span style="font-weight: bold; color: #ff4d4d;">حزمة سكنات Y9 Tool</span>
                    <label class="switch">
                        <input type="checkbox" onchange="toggleInjection(this, 'Skin_Y9Bundle.zip')">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
        </div>

        <!-- Terminal Log Box -->
        <div class="terminal" id="terminalBox">
            [System]: جاري طلب صلاحيات الوصول للملفات...<br>
        </div>
    </div>

    <script>
        // الأكواد الافتتاحية لبيانات الدخول
        let validUsers = {
            "admin": "admin123",
            "spiro": "1999"
        };
        let customKeys = ["SPIRO-VIP-2026"];
        let isAdmin = false;

        function handleLogin() {
            let user = document.getElementById('username').value.trim();
            let pass = document.getElementById('password').value.trim();
            let err = document.getElementById('errorMsg');

            if (user === "admin" && pass === "admin123") {
                isAdmin = true;
                openDashboard();
                return;
            }

            if ((validUsers[user] && validUsers[user] === pass) || customKeys.includes(user)) {
                isAdmin = false;
                document.getElementById('adminToggleBtn').style.display = 'none';
                openDashboard();
            } else {
                err.innerText = "خطأ: اسم المستخدم أو كلمة المرور أو المفتاح غير صحيح!";
            }
        }

        function openDashboard() {
            document.getElementById('loginContainer').style.display = 'none';
            document.getElementById('dashContainer').style.display = 'block';
        }

        function toggleAdminPanel() {
            let panel = document.getElementById('adminPanel');
            panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
        }

        function generateKey() {
            let randomKey = "SPIRO-" + Math.random().toString(36).substring(2, 8).toUpperCase();
            customKeys.push(randomKey);
            document.getElementById('keyList').innerHTML += `<br>• مفتاح جديد نشط: <b style="color:#00ff00;">${randomKey}</b>`;
            alert("تم إنشاء المفتاح بنجاح: " + randomKey);
        }

        function toggleInjection(checkbox, zipName) {
            let terminal = document.getElementById('terminalBox');
            
            if (checkbox.checked) {
                terminal.style.display = 'block';
                terminal.innerHTML += `[+] طلب إذن الوصول لمجلدات اللعبة...<br>`;
                
                setTimeout(() => {
                    terminal.innerHTML += `[+] جارٍ ضغط ونقل الملف: ${zipName}<br>`;
                }, 600);

                setTimeout(() => {
                    let targetPath = "android/data/com.dts.freefireth/files/contentcache/Optional/android/optionalavatarres/gameassetbundles/";
                    terminal.innerHTML += `[+] مسار الاستهداف: ${targetPath}<br>`;
                }, 1200);

                setTimeout(() => {
                    terminal.innerHTML += `[SUCCESS] تم فك ضغط وحقن الملف بنجاح في اللعبة! 🚀<br>`;
                    terminal.scrollTop = terminal.scrollHeight;
                }, 1800);
            } else {
                terminal.innerHTML += `[-] تم إيقاف التفعيل وإزالة السكن.<br>`;
                terminal.scrollTop = terminal.scrollHeight;
            }
        }
    </script>
</body>
</html>

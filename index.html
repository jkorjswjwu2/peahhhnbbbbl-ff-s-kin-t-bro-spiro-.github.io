<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPIRO X CHEAT</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #000000;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
        }
        .card {
            background: #0a0a0a;
            border: 2px solid #ff0000;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.4);
        }
        h1.title {
            color: #ff0000;
            text-align: center;
            font-size: 22px;
            margin-bottom: 25px;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.6);
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #ff4d4d;
            font-weight: bold;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 12px 15px;
            background: #121212;
            border: 1px solid #ff0000;
            color: #fff;
            border-radius: 25px;
            font-size: 15px;
            outline: none;
        }
        input:focus {
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.8);
        }
        button.btn {
            width: 100%;
            padding: 12px;
            background: #ff0000;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
        }
        button.btn:hover {
            background: #cc0000;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.8);
        }
        .error-msg {
            color: #ff3333;
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }
        /* Dashboard Styles */
        .dashboard {
            display: none;
            width: 100%;
            max-width: 650px;
            padding: 20px;
        }
        .header-dash {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 1px solid #ff0000;
            padding-bottom: 15px;
        }
        .skin-row {
            display: flex;
            align-items: center;
            background: #0d0d0d;
            border: 1px solid #330000;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 0 10px rgba(255,0,0,0.1);
            justify-content: space-between;
        }
        .skin-row img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #ff0000;
        }
        .skin-details {
            flex-grow: 1;
            padding: 0 20px;
        }
        .skin-title {
            color: #ff4d4d;
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 5px;
        }
        /* Toggle Switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 26px;
        }
        .switch input { 
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #333;
            transition: .4s;
            border-radius: 34px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: #ff0000;
        }
        input:checked + .slider:before {
            transform: translateX(24px);
        }
        /* Terminal */
        .terminal {
            background: #000;
            border: 1px solid #ff0000;
            color: #00ff00;
            padding: 15px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 12px;
            height: 140px;
            overflow-y: auto;
            margin-top: 20px;
            display: none;
        }
        .admin-panel {
            background: #121212;
            border: 1px dashed #ff0000;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none;
        }
        .admin-panel h3 {
            color: #ff0000;
            margin-bottom: 8px;
        }
        .key-list {
            margin-top: 10px;
            font-size: 13px;
            color: #ccc;
        }
    </style>
</head>
<body>

    <!-- Login Section -->
    <div class="container" id="loginContainer">
        <div class="card">
            <h1 class="title">WELCOME TO SPIRO X CHEAT</h1>
            <div class="form-group">
                <label>Username (Fixed):</label>
                <input type="text" id="username" value="SPIRO" readonly style="background: #1a1a1a; color: #ff4d4d; cursor: not-allowed;">
            </div>
            <div class="form-group">
                <label>VIP Key / Password:</label>
                <input type="password" id="password" placeholder="Enter VIP Key or Admin Password...">
            </div>
            <button class="btn" onclick="handleLogin()">Login</button>
            <div class="error-msg" id="errorMsg"></div>
        </div>
    </div>

    <!-- Dashboard Section -->
    <div class="dashboard" id="dashContainer">
        <div class="header-dash">
            <h2 style="color: #ff0000; font-size: 18px;">SPIRO X CHEAT PANEL</h2>
            <div>
                <button class="btn" style="padding: 6px 12px; font-size: 12px; width: auto;" id="adminToggleBtn" onclick="toggleAdminPanel()">Admin Panel</button>
                <button class="btn" style="padding: 6px 12px; font-size: 12px; background: #333; width: auto; margin-left: 5px;" onclick="location.reload()">Logout</button>
            </div>
        </div>

        <!-- Admin Panel -->
        <div class="admin-panel" id="adminPanel">
            <h3>Admin Creator Panel</h3>
            <p style="font-size: 12px; margin-bottom: 10px; color: #aaa;">Generate working VIP keys instantly for users:</p>
            <button class="btn" style="width: auto; padding: 6px 12px; font-size: 13px;" onclick="generateKey()">Create Key</button>
            <div class="key-list" id="keyList">Active Keys: <b>SPIRO-VIP-2026</b></div>
        </div>

        <h3 style="margin-bottom: 15px; color: #fff; font-size: 16px;">Skins Directory:</h3>
        
        <!-- Skin Item -->
        <div class="skin-row">
            <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' fill='%23111'><rect width='100%' height='100%'/><text x='50%' y='50%' fill='%23ff0000' font-size='12' text-anchor='middle' dy='.3em'>HIP HOP</text></svg>" alt="HipHop Skin">
            <div class="skin-details">
                <div class="skin-title">CRIME ALOK / HIP HOP SKIN</div>
                <div style="font-size: 11px; color: #888;">Auto Inject & Extract</div>
            </div>
            <label class="switch">
                <input type="checkbox" onchange="toggleInjection(this, 'hiphop.zip')">
                <span class="slider"></span>
            </label>
        </div>

        <!-- Terminal Log Box -->
        <div class="terminal" id="terminalBox">
            [System]: Ready for injection...<br>
        </div>
    </div>

    <script>
        let adminPass = "admin123";
        let customKeys = ["SPIRO-VIP-2026"];
        let isAdmin = false;

        function handleLogin() {
            let pass = document.getElementById('password').value.trim();
            let err = document.getElementById('errorMsg');

            if (pass === adminPass) {
                isAdmin = true;
                openDashboard();
                return;
            }

            if (customKeys.includes(pass)) {
                isAdmin = false;
                document.getElementById('adminToggleBtn').style.display = 'none';
                openDashboard();
            } else {
                err.innerText = "Error: Invalid VIP Key or Admin Password!";
            }
        }

        function openDashboard() {
            document.getElementById('loginContainer').style.display = 'none';
            document.getElementById('dashContainer').style.display = 'block';
        }

        function toggleAdminPanel() {
            let panel = document.getElementById('adminPanel');
            panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
        }

        function generateKey() {
            let randomKey = "SPIRO-" + Math.random().toString(36).substring(2, 8).toUpperCase();
            customKeys.push(randomKey);
            document.getElementById('keyList').innerHTML += `<br>• New Key: <b style="color:#00ff00;">${randomKey}</b>`;
            alert("Key generated successfully: " + randomKey);
        }

        function toggleInjection(checkbox, zipName) {
            let terminal = document.getElementById('terminalBox');
            
            if (checkbox.checked) {
                terminal.style.display = 'block';
                terminal.innerHTML += `[+] Requesting storage permissions...<br>`;
                
                setTimeout(() => {
                    terminal.innerHTML += `[+] Injecting and transferring archive: ${zipName}<br>`;
                }, 600);

                setTimeout(() => {
                    let targetPath = "android/data/com.dts.freefireth/files/contentcache/Optional/android/optionalavatarres/gameassetbundles/";
                    terminal.innerHTML += `[+] Target Path: ${targetPath}<br>`;
                }, 1200);

                setTimeout(() => {
                    terminal.innerHTML += `[SUCCESS] Extracted and injected successfully into FreeFire path! 🚀<br>`;
                    terminal.scrollTop = terminal.scrollHeight;
                }, 1800);
            } else {
                terminal.innerHTML += `[-] Injection disabled and skin removed.<br>`;
                terminal.scrollTop = terminal.scrollHeight;
            }
        }
    </script>
</body>
</html>

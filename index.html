<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أستاذة نادية المحامية - خدمات الاستشارات والأوراق القانونية</title>
    <!-- خط تجوال من Google Fonts لمظهر احترافي 4K -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* إعدادات الخلفية والتصميم العام (Ultra Clean Dark Mode) */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: #0a0a0a;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image: radial-gradient(circle at 50% 0%, #1a1a1a 0%, #0a0a0a 75%);
        }

        .container {
            width: 100%;
            max-width: 580px;
            background: rgba(18, 18, 18, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 40px 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 20px rgba(255, 255, 255, 0.03);
        }

        /* الهيدر وشعار المحاماة */
        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        .scale-icon {
            font-size: 42px;
            color: #ffffff;
            display: inline-block;
            margin-top: 5px;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.4));
        }

        /* تصميم الحقول والمجموعات */
        .form-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 8px;
            color: #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* المدخلات والقوائم بالإنحناء الدائري الفخم */
        input, select {
            width: 100%;
            padding: 14px 18px;
            background-color: #141414;
            border: 1.5px solid rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            color: #ffffff;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        /* حقل التليفون LTR عشان الأرقام تظهر صح */
        #whatsapp {
            direction: ltr;
            text-align: right;
        }

        select {
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: left 18px center;
            background-size: 16px;
        }

        select option {
            background-color: #1a1a1a;
            color: #ffffff;
        }

        input:focus, select:focus {
            border-color: #ffffff;
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.3);
            background-color: #1c1c1c;
        }

        /* عرض السعر */
        .price-badge {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px 20px;
            border-radius: 50px;
            text-align: center;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 20px;
            font-size: 16px;
            display: none;
        }

        /* رسالة الحالة */
        .status-msg {
            display: none;
            text-align: center;
            padding: 14px;
            border-radius: 50px;
            margin-top: 15px;
            font-weight: 700;
            font-size: 15px;
        }

        .status-msg.success {
            display: block;
            background: rgba(40, 167, 69, 0.15);
            border: 1px solid rgba(40, 167, 69, 0.6);
            color: #4ade80;
        }

        .status-msg.error {
            display: block;
            background: rgba(220, 53, 69, 0.15);
            border: 1px solid rgba(220, 53, 69, 0.6);
            color: #f87171;
        }

        /* زر الإرسال */
        .submit-btn {
            width: 100%;
            padding: 16px;
            background-color: #ffffff;
            color: #000000;
            font-size: 17px;
            font-weight: 900;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(255, 255, 255, 0.15);
        }

        .submit-btn:hover {
            background-color: #e6e6e6;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 255, 255, 0.25);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- الهيدر -->
        <div class="header">
            <h1>أستاذه نادية المحامية</h1>
            <div class="scale-icon">⚖️</div>
        </div>

        <!-- فورم Web3Forms -->
        <form id="lawForm" action="https://api.web3forms.com/submit" method="POST">
            
            <!-- مفتاح Web3Forms (مخفي) -->
            <input type="hidden" name="access_key" value="c9c6559a-f742-4ec6-944a-055368731d42">
            
            <!-- موضوع الإيميل -->
            <input type="hidden" name="subject" value="طلب خدمة جديد - أستاذة نادية المحامية">
            
            <!-- اسم المرسل اللي هيظهر في الإيميل -->
            <input type="hidden" name="from_name" value="موقع أستاذة نادية المحامية">

            <!-- نوع المعاملة -->
            <div class="form-group">
                <label for="service">اختر نوع المعاملة</label>
                <select id="service" name="نوع_المعاملة" required onchange="updatePrice()">
                    <option value="" disabled selected>-- اضغط هنا للاختيار --</option>
                    <option value="توكيل">توكيل</option>
                    <option value="عقد بيع">عقد بيع</option>
                    <option value="عقد إيجار">عقد إيجار</option>
                </select>
            </div>

            <!-- مربع عرض السعر تلقائياً -->
            <div id="priceBox" class="price-badge">
                سعر الخدمة: <span id="priceValue">0</span> جنيه
            </div>

            <!-- اسم البائع -->
            <div class="form-group">
                <label for="seller">اسم البائع</label>
                <input type="text" id="seller" name="اسم_البائع" placeholder="أدخل اسم البائع بالكامل" autocomplete="name" required>
            </div>

            <!-- اسم المشتري -->
            <div class="form-group">
                <label for="buyer">اسم المشتري</label>
                <input type="text" id="buyer" name="اسم_المشتري" placeholder="أدخل اسم المشتري بالكامل" autocomplete="name" required>
            </div>

            <!-- رقم الواتساب -->
            <div class="form-group">
                <label for="whatsapp">رقم الواتساب</label>
                <input type="tel" id="whatsapp" name="رقم_الواتساب" placeholder="01xxxxxxxx" 
                       pattern="[0-9]{11}" maxlength="11" inputmode="numeric"
                       title="أدخل 11 رقم فقط" autocomplete="tel" required>
            </div>

            <!-- رقم العملية -->
            <div class="form-group">
                <label for="transaction_id">رقم العملية</label>
                <input type="text" id="transaction_id" name="رقم_العملية" placeholder="أدخل رقم العملية الحسابية" required>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">إرسال البيانات</button>

            <!-- رسالة نجاح/فشل -->
            <div id="statusMsg" class="status-msg"></div>
        </form>
    </div>

    <!-- كود الجافاسكريبت لتغيير السعر تلقائياً وإرسال الفورم -->
    <script>
        function updatePrice() {
            const serviceSelect = document.getElementById('service');
            const priceBox = document.getElementById('priceBox');
            const priceValue = document.getElementById('priceValue');

            let price = "";
            
            if (serviceSelect.value === "توكيل") {
                price = "250,000";
            } else if (serviceSelect.value === "عقد بيع") {
                price = "500,000";
            } else if (serviceSelect.value === "عقد إيجار") {
                price = "300,000";
            }

            if (price !== "") {
                priceValue.innerText = price;
                priceBox.style.display = "block";
            } else {
                priceBox.style.display = "none";
            }
        }

        // إرسال الفورم عبر AJAX عشان نعرض رسالة نجاح بدون إعادة تحميل الصفحة
        const form = document.getElementById('lawForm');
        const submitBtn = document.getElementById('submitBtn');
        const statusMsg = document.getElementById('statusMsg');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            submitBtn.disabled = true;
            submitBtn.innerText = 'جارٍ الإرسال...';
            statusMsg.className = 'status-msg';
            statusMsg.innerText = '';

            try {
                const formData = new FormData(form);
                const response = await fetch(form.action, {
                    method: 'POST',
                    body: formData,
                    headers: { 'Accept': 'application/json' }
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    statusMsg.className = 'status-msg success';
                    statusMsg.innerText = '✅ تم إرسال البيانات بنجاح، سيتم التواصل معك قريباً.';
                    form.reset();
                    updatePrice();
                    document.getElementById('priceBox').style.display = 'none';
                } else {
                    statusMsg.className = 'status-msg error';
                    statusMsg.innerText = '❌ ' + (data.message || 'حدث خطأ أثناء الإرسال.');
                }
            } catch (err) {
                statusMsg.className = 'status-msg error';
                statusMsg.innerText = '❌ تعذر الاتصال بالسيرفر. تحقق من الإنترنت وحاول مرة أخرى.';
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = 'إرسال البيانات';
            }
        });
    </script>

</body>
</html>
